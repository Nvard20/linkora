<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio Page</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f4f8;
}

.wrapper{
max-width:900px;
margin:auto;
padding:40px 20px;
text-align:center;
}

.profile{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
}

.title{
font-size:26px;
margin-top:10px;
}

.subtitle{
color:#666;
margin-bottom:25px;
}

.links a{
display:block;
max-width:420px;
margin:12px auto;
padding:15px;
border-radius:30px;
background:#FFD400;
color:#d65c00;
font-weight:bold;
text-decoration:none;
}

.gallery{
margin-top:30px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:10px;
}

.gallery img{
width:100%;
border-radius:12px;
}

.social{
margin-top:30px;
}

.social img{
width:26px;
margin:0 10px;
}
.about{
margin-top:30px;
font-size:15px;
line-height:1.6;
color:#444;
padding:0 10px;
}

</style>
</head>

<body>

<div class="wrapper">

<img class="profile" src="https://via.placeholder.com/100">

<h1 class="title">Hydra Juice</h1>
<p class="subtitle">Your daily dose of vitamin C</p>

<div class="links">

<a href="#">Our drinks</a>
<a href="#">Find us</a>
<a href="#">Wellbeings</a>

</div>
<div class="about">

<p>
Hydra Juice is a healthy juice brand focused on daily vitamin C.
We bring fresh drinks, wellness, and positive energy to your day.
</p>

</div>
<div class="gallery">

<img src="https://images.unsplash.com/photo-1497534446932-c925b458314e">
<img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93">
<img src="https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea">

</div>

<div class="social">

<img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
<img src="https://cdn-icons-png.flaticon.com/512/3046/3046126.png">
<img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">

</div>

</div>

</body>
</html>
