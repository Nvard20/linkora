<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bio | Linkora</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;padding:20px;text-align:center;}
.profile{width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:10px;}
.links a, .gallery img{display:block;margin:8px auto;padding:10px;background:#6C63FF;color:white;border-radius:10px;text-decoration:none;}
.gallery img{width:80px;height:80px;margin:5px;display:inline-block;}
.about-section{margin-top:30px;padding:30px;background:#6C63FF;color:white;border-radius:15px;}
</style>
</head>
<body>

<img src="https://via.placeholder.com/100" class="profile" id="profile">
<h3 id="pageTitle">Page Title</h3>

<div id="linksContainer" class="links"></div>
<div id="galleryContainer" class="gallery"></div>

<div class="about-section">
<h2>About Me</h2>
<p id="aboutText">About text goes here.</p>
</div>

<script>
// Load data from localStorage (frontend demo)
const data = JSON.parse(localStorage.getItem("bioPageData") || "{}")

if(data.profile) document.getElementById("profile").src = data.profile
if(data.title) document.getElementById("pageTitle").textContent = data.title

const linksContainer = document.getElementById("linksContainer")
if(data.links) data.links.forEach(link=>{
    const a = document.createElement("a")
    a.href = link
    a.textContent = link
    a.target="_blank"
    linksContainer.appendChild(a)
})

const galleryContainer = document.getElementById("galleryContainer")
if(data.gallery) data.gallery.forEach(src=>{
    const img = document.createElement("img")
    img.src = src
    galleryContainer.appendChild(img)
})

if(data.about) document.getElementById("aboutText").textContent = data.about
</script>

</body>
</html>
