<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Linkora</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(-45deg,#6C63FF,#4A47A3,#6C63FF,#4A47A3);
background-size:400% 400%;
animation:gradientBG 15s ease infinite;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* CARD */

.login-card{
background:white;
padding:40px;
border-radius:20px;
width:350px;
box-shadow:0 20px 40px rgba(0,0,0,0.2);
text-align:center;
}

.login-card h2{
margin-bottom:25px;
color:#4A47A3;
}

/* INPUT */

.input-group{
margin-bottom:18px;
}

.input-group input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
}

.input-group input:focus{
outline:none;
border-color:#6C63FF;
}

/* BUTTON */

.login-btn{
width:100%;
padding:12px;
background:#6C63FF;
border:none;
color:white;
border-radius:10px;
font-size:16px;
cursor:pointer;
transition:.3s;
}

.login-btn:hover{
background:#4A47A3;
}

/* LINKS */

.auth-links{
margin-top:15px;
font-size:14px;
}

.auth-links a{
color:#6C63FF;
text-decoration:none;
font-weight:bold;
}

.auth-links a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-card">

<h2>Login</h2>

<form>

<div class="input-group">
<input type="email" placeholder="Email" required>
</div>

<div class="input-group">
<input type="password" placeholder="Password" required>
</div>

<button class="login-btn">Login</button>

</form>

<div class="auth-links">
<p>Don't have an account? <a href="register.html">Register</a></p>
</div>

</div>

</body>
</html>
